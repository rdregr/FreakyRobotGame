<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREAKYROBOTGAME</title><style>*{box-sizing:border-box}body{margin:0;background:#090d12;color:#f0f4f8;font:15px system-ui}#menu{max-width:560px;margin:8vh auto;padding:26px;background:#161f29;border:1px solid #42546a;border-radius:18px}h1{font-size:34px;letter-spacing:2px}button,input{background:#243448;border:1px solid #58718b;border-radius:8px;padding:13px;color:white;font:inherit}button{cursor:pointer}button:hover{background:#3c536c}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}input{width:100%;margin:8px 0}#game{display:none}#view{display:block;width:100vw;height:100vh}#hud{position:fixed;top:12px;left:16px;pointer-events:none;text-shadow:0 2px 4px black}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;pointer-events:none}#chat{position:fixed;bottom:16px;left:16px;width:min(360px,75vw);background:#0c141cbd;padding:10px;border-radius:9px}#messages{height:105px;overflow:auto;font-size:13px}#chatInput{margin:5px 0 0;padding:9px}#help{position:fixed;top:12px;right:12px;background:#101b27aa;padding:10px;border-radius:8px}#notice{color:#ffba80;min-height:24px}small{color:#afc0cf}</style></head><body><div id="menu"><h1>FREAKYROBOTGAME</h1><p>Online factory duel · Alpha 0.1</p><label>Pilot name</label><input id="name" maxlength="18" value="Pilot"><label>Friend's lobby code</label><input id="code" maxlength="4" placeholder="ABCD"><div class="buttons"><button id="create">CREATE 1V1 LOBBY</button><button id="join">JOIN LOBBY</button></div><p id="notice"></p><small>Two players needed. For now, this is a working 1v1 test build; 2v2, operators, bots and public matchmaking come later.</small></div><div id="game"><canvas id="view"></canvas><div id="hud"></div><div id="cross">+</div><div id="help">Click game to aim · WASD move · Left click shoot · / chat · Esc unlock mouse</div><div id="chat"><div id="messages"></div><input id="chatInput" placeholder="Press / to chat, Enter to send"></div></div><script src="/socket.io/socket.io.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const socket=io(),$=id=>document.getElementById(id);let id='',room='',snapshot=null,yaw=0,pitch=0,keys={},locked=false,actors=new Map();const scene=new THREE.Scene();scene.background=new THREE.Color('#111b25');scene.fog=new THREE.Fog('#111b25',15,58);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.06,100);const renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));scene.add(new THREE.HemisphereLight(0x8caed0,0x27221b,2));const light=new THREE.DirectionalLight(0xffd4a0,2);light.position.set(8,15,4);scene.add(light);function box(x,y,z,w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.75,metalness:.25}));m.position.set(x,y,z);scene.add(m);return m}box(21,-.12,21,42,.25,42,0x393d43);box(21,4,0,42,8,2,0x414951);box(21,4,40,42,8,2,0x414951);box(0,4,21,2,8,42,0x414951);box(40,4,21,2,8,42,0x414951);for(const [x,z,w,d] of [[12,13,5,4],[27,24,5,4],[19,8,4,6],[19,29,4,5]]){box(x+w/2,1.5,z+d/2,w,3,d,0x755844);box(x+w/2,3.05,z+d/2,w,.15,d,0xe1a845)}for(let i=0;i<9;i++)box(4+i*4,7.3,21,.2,.4,39,0x2d3b44);const gun=box(.42,-.38,-.85,.23,.23,.9,0x566879);camera.add(gun);scene.add(camera);function robot(color){const group=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color,metalness:.7,roughness:.3});function part(w,h,d,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);group.add(m)}part(.8,1,.5,0,1.25,0);part(.52,.48,.5,0,2.03,0);part(.23,.8,.27,-.61,1.3,0);part(.23,.8,.27,.61,1.3,0);part(.28,.9,.32,-.25,.48,0);part(.28,.9,.32,.25,.48,0);return group}function updateActors(){if(!snapshot)return;for(const p of snapshot.players){if(p.id===id)continue;let mesh=actors.get(p.id);if(!mesh){mesh=robot(0xe55b50);scene.add(mesh);actors.set(p.id,mesh)}mesh.position.set(p.x,0,p.z);mesh.rotation.y=p.yaw;mesh.visible=!p.dead}for(const [key,m] of actors)if(!snapshot.players.some(p=>p.id===key)){scene.remove(m);actors.delete(key)}}function showGame(){ $('menu').style.display='none';$('game').style.display='block';resize() }socket.on('joined',d=>{id=d.id;room=d.code;showGame()});socket.on('notice',msg=>$('notice').textContent=msg);socket.on('state',s=>{if(s.code!==room)return;snapshot=s;updateActors();const me=s.players.find(p=>p.id===id);if(me){$('hud').textContent='LOBBY '+room+' | '+(s.started?'FIGHT!':'WAITING FOR FRIEND')+' | HP '+me.hp+' | KILLS '+me.kills;camera.position.set(me.x,1.75,me.z)}});socket.on('chat',m=>{const e=document.createElement('div');e.textContent=m.name+': '+m.text;$('messages').append(e);$('messages').scrollTop=$('messages').scrollHeight});socket.on('shot',data=>{const p=new THREE.Vector3(data.x,1.5,data.z),dir=new THREE.Vector3(Math.sin(data.yaw),0,Math.cos(data.yaw));const bullet=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xffd14b}));scene.add(bullet);let t=0;const anim=()=>{t+=.7;bullet.position.copy(p).addScaledVector(dir,t);if(t<18)requestAnimationFrame(anim);else scene.remove(bullet)};anim()});$('create').onclick=()=>socket.emit('create',{name:$('name').value});$('join').onclick=()=>socket.emit('join',{code:$('code').value,name:$('name').value});const chat=$('chatInput');document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==chat&&id){e.preventDefault();document.exitPointerLock?.();chat.focus();return}if(document.activeElement===chat){if(e.key==='Enter'){if(chat.value.trim())socket.emit('chat',chat.value);chat.value='';chat.blur()}return}keys[e.key.toLowerCase()]=true});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);$('view').onclick=()=>{$('view').requestPointerLock?.()};document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===$('view'));document.addEventListener('mousemove',e=>{if(!locked)return;yaw+=e.movementX*.002;pitch=Math.max(-1.2,Math.min(1.2,pitch+e.movementY*.002))});document.addEventListener('mousedown',e=>{if(e.button===0&&locked)socket.emit('fire')});function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}window.addEventListener('resize',resize);let last=0;function tick(now){requestAnimationFrame(tick);if(id&&snapshot?.started&&now-last>35&&document.activeElement!==chat){last=now;let x=Number(!!keys.d)-Number(!!keys.a),z=Number(!!keys.w)-Number(!!keys.s);socket.emit('move',{dx:Math.sin(yaw)*z+Math.cos(yaw)*x,dz:Math.cos(yaw)*z-Math.sin(yaw)*x,yaw})}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=-pitch;renderer.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
